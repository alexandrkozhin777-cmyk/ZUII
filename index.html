<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зуи — деревенская жизнь</title>
<style>
:root{--bg:#f1ead8;--card:#fff9ea;--tx:#33291a;--mut:#7a6a4a;--ac:#3f8f3f;--ac2:#e0a030;--bd:#d9ccaa;--bad:#c0392b}
:root[data-theme="dark"]{--bg:#171a14;--card:#232820;--tx:#f0ead8;--mut:#a89c80;--bd:#3a4034}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
#app{width:100%;max-width:560px;padding:0 12px calc(78px + env(safe-area-inset-bottom,0px))}
#hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--bd)}
.r1{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.r1 b{font-size:24px}.r1 small{color:var(--mut);margin-left:4px}
.pills{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--bd);padding:5px 9px;border-radius:99px;font-weight:700;color:var(--tx);font:inherit;font-size:14px;font-weight:700}
button.pill{cursor:pointer}
.en{position:relative;height:16px;background:var(--bd);border-radius:9px;margin-top:6px;overflow:hidden}
.en i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f0b429,#ffd966);border-radius:9px;transition:width .3s}
.en span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:16px}
#hint{margin-top:6px;font-size:13px;background:var(--card);border:1px dashed var(--ac2);border-radius:10px;padding:6px 9px;cursor:pointer}
h3.t{margin:12px 0 6px;font-size:17px}
.mapc{position:relative}
#mapw{height:60vh;min-height:340px;overflow:auto;border-radius:14px;border:1px solid var(--bd);background:#f4f0e2;-webkit-overflow-scrolling:touch}
#msv{display:block;width:170%}
#msv text{font-family:system-ui,sans-serif;pointer-events:none}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zb button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:800 20px system-ui}
.hs{cursor:pointer}.hs .rg{animation:rg 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rg{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.isl{animation:isl 14s ease-in-out infinite alternate}@keyframes isl{from{transform:translate(-10px,2px)}to{transform:translate(14px,-3px)}}
.bob{animation:bob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.fw{stroke-dasharray:6 10;animation:fw 3s linear infinite}@keyframes fw{to{stroke-dashoffset:-32}}
.car{animation:cv 8s linear infinite}@keyframes cv{from{transform:translateY(-30px)}to{transform:translateY(900px)}}
.cl{animation:cl 60s linear infinite;pointer-events:none}@keyframes cl{from{transform:translateX(-120px)}to{transform:translateX(760px)}}
.sn{animation:sn 6s linear infinite}@keyframes sn{from{transform:translateY(-20px)}to{transform:translateY(860px)}}
.sm{animation:sm 3s ease-out infinite;transform-box:fill-box}@keyframes sm{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-16px);opacity:0}}
.ov{transition:opacity 2s;pointer-events:none}
.bld{transition:opacity .8s;opacity:0}.bld.on{opacity:1}
.potw{display:flex;justify-content:center;margin:12px 0;position:relative}
#pot{width:130px;height:130px;border-radius:50%;border:4px solid var(--ac2);background:radial-gradient(circle at 35% 30%,#fff3c4,#e8b85a);font-size:70px;line-height:1;cursor:pointer;box-shadow:0 5px 0 #a87a22;transition:transform .08s;touch-action:manipulation}
#pot:active{transform:scale(.93) translateY(3px);box-shadow:0 2px 0 #a87a22}
.fx{position:absolute;font-weight:900;font-size:22px;color:var(--ac);pointer-events:none;animation:fx .9s ease-out forwards}
@keyframes fx{to{transform:translateY(-70px);opacity:0}}
.sub{display:flex;gap:5px;margin:4px 0;flex-wrap:wrap}
.sub button{flex:1;min-width:70px;padding:9px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 13px system-ui}
.sub button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:6px 0;flex-wrap:wrap}
.it .e{font-size:28px;width:40px;text-align:center;flex-shrink:0}
.it .m{flex:1;min-width:0}.it .m b{display:block}.it .m small{color:var(--mut)}
.it button,.box button.ab{border:0;border-radius:10px;background:var(--ac2);color:#2a1d00;font:800 14px system-ui;padding:10px 12px;min-width:84px}
.it button:disabled,.box button:disabled{opacity:.4}.it.done{opacity:.6}
.hr{letter-spacing:1px;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:120px;object-fit:cover;display:block}
.ph .lk{height:120px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--bd)}
.ph small{display:block;padding:6px 8px;color:var(--mut);font-size:12px;line-height:1.25}.ph b{display:block;padding:6px 8px 0;font-size:13px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav div{display:flex;width:100%;max-width:560px;overflow-x:auto}
#nav button{flex:1;min-width:56px;padding:8px 0 7px;border:0;background:none;color:var(--mut);font:700 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#nav button span{font-size:22px;line-height:1}#nav button.on{color:var(--ac)}
#nav button i{position:absolute;top:3px;right:15%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-style:normal}
#mod{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
#mod.on{display:flex}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border:2px solid var(--ac2);border-bottom:0}
#mx{position:sticky;top:0;float:right;width:40px;height:40px;border-radius:50%;border:0;background:var(--bd);color:var(--tx);font:800 20px system-ui;z-index:2;margin:-4px -4px 0 8px}
.box h2{margin:0 0 6px;font-size:20px}.box p{margin:0 0 10px;color:var(--mut);line-height:1.4}
.box img.hd{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.box button.ab{display:block;width:100%;margin:7px 0 0;padding:12px;text-align:left}
.box button.ok{background:var(--ac);color:#fff;text-align:center}
.box button.hot{background:var(--bad);color:#fff;font-size:20px;text-align:center;padding:16px;animation:ht .3s ease-in-out infinite alternate}
@keyframes ht{to{transform:scale(1.04)}}
.res{background:var(--bg);border-radius:10px;padding:9px;margin:8px 0;font-size:14px;line-height:1.4;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.grid button{height:70px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);font-size:32px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#222e;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center;display:none;pointer-events:none}
button:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}.row button{flex:1;min-width:130px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 14px system-ui}
@media(prefers-reduced-motion:reduce){.isl,.bob,.fw,.car,.cl,.sn,.sm,.rg{animation:none}}
</style>
</head>

</div>

/* ===== ежедневка ===== */
function ensureDaily(){
  const today=new Date().toDateString();
  if(S.daily&&S.daily.date===today)return;
  const goals=[{t:'🥔 Копнуть 50 раз',n:()=>S.st.taps,goal:50,r:{p:500}},
    {t:'🎣 Поймать 3 рыбы',n:()=>S.st.fish,goal:3,r:{p:600,item:['bread',2]}},
    {t:'📸 Сделать 1 фото',n:()=>nPh(),goal:1,r:{p:700,rep:2}},
    {t:'💧 Набрать 3 воды',n:()=>S.st.water,goal:3,r:{p:400}},
    {t:'💬 Поговорить 3 раза',n:()=>Object.values(S.cd).filter(c=>c>0).length,goal:3,r:{p:500}}];
  const g=pick(goals);
  S.daily={date:today,idx:goals.indexOf(g),start:g.n()};
  S.dailyDone=0;
}
function checkDaily(){
  if(!S.daily)return false;
  const goals=[{n:()=>S.st.taps,goal:50,r:{p:500}},{n:()=>S.st.fish,goal:3,r:{p:600,item:['bread',2]}},{n:()=>nPh(),goal:1,r:{p:700,rep:2}},{n:()=>S.st.water,goal:3,r:{p:400}},{n:()=>Object.values(S.cd).filter(c=>c>0).length,goal:3,r:{p:500}}];
  const g=goals[S.daily.idx];
  return (g.n()-S.daily.start)>=g.goal;
}
function claimDaily(){
  if(!checkDaily()||S.dailyDone)return;
  const goals=[{r:{p:500}},{r:{p:600,item:['bread',2]}},{r:{p:700,rep:2}},{r:{p:400}},{r:{p:500}}];
  const r=goals[S.daily.idx].r;
  if(r.p)S.p+=r.p;if(r.rep)S.rep+=r.rep;if(r.item)addI(r.item[0],r.item[1]);
  S.dailyDone=1;SFX.win();toast('🎁 Ежедневка выполнена!');saveG();renderAll();
}
/* ===== престиж ===== */
function canPrestige(){return S.p>=1e6*Math.pow(3,S.prestige||0)}
function doPrestige(){
  if(!canPrestige())return;
  const gain=Math.floor(Math.sqrt(S.p/1e6))*(1+S.prestige);
  S.prestige=(S.prestige||0)+1;S.perkPts=(S.perkPts||0)+gain;
  const keep={prestige:S.prestige,perkPts:S.perkPts,ph:S.ph,ac:S.ac,fp:S.fp,seen:1,snd:S.snd,theme:S.theme};
  S=Object.assign(def(),keep);
  closeM();renderAll();hud();toast('🔥 Перерождение! Перков: '+S.perkPts);SFX.win();
}

function viewM(v){
  const cp=canPrestige(), gain=Math.floor(Math.sqrt(S.p/1e6))*(1+(S.prestige||0));
  let h=`<h3 class="t">Как играть</h3><div class="it" style="display:block"><b>1.</b> Копай бульбу во «Дворе».<br><b>2.</b> На «Карте» — значки мест: рыбалка, крыница, мел, пляж, фото.<br><b>3.</b> «Квесты» и «Ежедневка» дают цели.<br><b>4.</b> «Жители» дают бонусы.<br><b>5.</b> «Альбом»: 17 фото, некоторые только ночью/зимой (жми ⏩).<br><b>6.</b> Постройки появляются на карте.</div>
<h3 class="t">Перерождение</h3><div class="it"><div class="e">🔥</div><div class="m"><b>Перерождений: ${S.prestige||0}</b><small>${cp?'Можно переродиться за +'+gain+' перков':'Нужно '+fmt(1e6*Math.pow(3,S.prestige||0))+' 🥔'}. Перки дают +10% к клику и +20% к доходу за каждый.</small></div>${cp?`<button id="pBtn" style="background:var(--bad);color:#fff">🔥 Переродиться</button>`:''}</div>
<h3 class="t">Достижения</h3><div class="chips">${AC.map((a,i)=>`<span class="chip" style="opacity:${S.ac[i]?1:.4}">${a[0]} ${a[1]}</span>`).join('')}</div>
<h3 class="t">Настройки</h3><div class="row"><button id="sSn">${snd?'🔊 Звук вкл':'🔇 Звук выкл'}</button><button id="sSe">${season()==='winter'?'❄️ Зима':'☀️ Лето'}: сменить</button></div><div class="row"><button id="sTheme">${document.documentElement.dataset.theme==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'}</button><button id="sSh">↗ Поделиться</button></div><div class="row"><button id="sExp">📤 Экспорт сохранения</button><button id="sImp">📥 Импорт</button></div><div class="row"><button id="sRs" style="background:var(--bad);color:#fff">🗑️ Начать заново</button></div>
<p style="color:var(--mut);font-size:12px">Герои и случаи придуманы. Места, карта и фото — из настоящих Зуёв.</p>`;
  v.innerHTML=h;
  if($('#pBtn'))$('#pBtn').onclick=doPrestige;
  $('#sSn').onclick=()=>{snd=!snd;S.snd=snd?1:0;if(snd){A();SFX.good()}hud();viewM(v)};
  $('#sSe').onclick=()=>{S.t=(Math.floor(S.t/540)+1)*540+1;hud();viewM(v)};
  $('#sTheme').onclick=()=>{const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';S.theme=document.documentElement.dataset.theme;saveG();viewM(v)};
  $('#sSh').onclick=share;
  $('#sExp').onclick=exportSave;
  $('#sImp').onclick=importSave;
  $('#sRs').onclick=()=>{if(confirm('Начать заново? Прогресс пропадёт.')){S=def();try{localStorage.removeItem('zui3')}catch(e){}mapEl=null;farmEl=null;mapView=null;tab=0;renderAll();hud();tutorial()}}
}
async function share(){
  const d={title:'Зуи — деревенская жизнь',text:'Играй в игру про деревню Зуи!',url:location.href};
  try{if(navigator.share&&location.protocol!=='file:'){await navigator.share(d);return}}catch(e){}
  try{await navigator.clipboard.writeText(location.href);toast('🔗 Ссылка скопирована. Кидай землякам!');return}catch(e){}
  exportSave();
}
function exportSave(){
  const code=btoa(encodeURIComponent(JSON.stringify(S)));
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>toast('📤 Код сохранения скопирован!')).catch(()=>prompt('Скопируй код:',code))}
  else prompt('Скопируй код:',code);
}
function importSave(){
  const code=prompt('Вставь код сохранения:');
  if(!code)return;
  try{S=Object.assign(def(),JSON.parse(decodeURIComponent(atob(code))));S.st=Object.assign(def().st,S.st||{});if(S.theme)document.documentElement.dataset.theme=S.theme;snd=!!S.snd;mapEl=null;farmEl=null;mapView=null;renderAll();hud();toast('📥 Загружено!');SFX.win()}
  catch(e){toast('❌ Битый код')}
}
/* ===== HUD ===== */
function hud(){
  $('#p').textContent=fmt(S.p);$('#ps').textContent='+'+fmt(sec()*mult())+'/с'+(S.modT>0?' ⚡':'');$('#repP').textContent='⭐ '+S.rep;
  $('#prP').style.display=S.prestige?'':'none';$('#prP').textContent='🔥 '+(S.prestige||0);
  const m=enMax();$('#enb').style.width=Math.min(100,100*S.en/m)+'%';$('#ent').textContent='⚡ '+Math.floor(S.en)+' / '+m;
  $('#clk').textContent={morning:'🌅',day:'☀️',evening:'🌇',night:'🌙'}[phase()]+(season()==='winter'?'❄️':'');
  $('#snd').textContent=snd?'🔊':'🔇';
  const c=curQ(),h=$('#hint');
  if(c<0)h.textContent='🏆 Все квесты выполнены!';
  else{const q=QU[c],[a,b]=q.n();h.textContent=a>=b?'🎁 Квест «'+q.t+'» готов. Забери награду.':'📌 '+q.t+': '+q.d+' ('+Math.min(a,b)+'/'+b+')'}
  if(mapEl){const ph=phase(),n={morning:.1,day:0,evening:.22,night:.55}[ph];$('#nt',mapEl).style.opacity=n;$('#lit',mapEl).style.opacity=ph==='night'?1:ph==='evening'?.6:0;$('#wt',mapEl).style.opacity=season()==='winter'?1:0}
}
$('#hint').onclick=()=>{tab=2;renderAll()};
$('#skip').onclick=()=>{const x=S.t%180,b=[30,100,140,180].find(v=>v>x);S.t+=b-x+.5;if(phase()==='night')S.st.nights++;SFX.pop();hud();toast('Время: '+{morning:'утро',day:'день',evening:'вечер',night:'ночь'}[phase()]+(season()==='winter'?', зима':', лето'))};
$('#snd').onclick=()=>{snd=!snd;S.snd=snd?1:0;if(snd){A();SFX.good()}hud()};
/* ===== события ===== */
let evTimer=null;
function showEv(){if(busy||document.hidden){evTimer=setTimeout(showEv,5000);return}
  const pool=EV.filter(x=>!x.ok||x.ok());if(!pool.length){evTimer=setTimeout(showEv,30000);return}
  const e=pick(pool);SFX.ev();
  openM(`<h2>${e.t}</h2><p>${e.x}</p><div id="ec"></div>`,()=>{e.c.forEach((c,i)=>{const b=document.createElement('button');b.className='ab'+(i?'':' ok');b.textContent=c[0];b.onclick=()=>{const t=c[1]();checkAch();checkDaily();saveG();$('#mb').innerHTML=`<h2>${e.t}</h2><div class="res">${t}</div><button class="ab ok" id="ok">Ясно</button>`;$('#ok').onclick=closeM;hud()};$('#ec').appendChild(b)})});
  evTimer=setTimeout(showEv,(40+R()*35)*1000)}
function tutorial(){S.seen=1;openM(`<img class="hd" src="${PH[10]||''}" alt=""><h2>Добро пожаловать в Зуи!</h2><p>Деревня на реке Сож, озеро Кричевское, меловые холмы. Около 200 жителей, а летом ещё 150 дачников.</p><div class="res">🥔 Копай бульбу во «Дворе».<br>🗺️ Жми значки на карте.<br>📜 Квесты и ежедневка — сверху.<br>📸 Собирай фото (17 кадров).<br>🔥 Перерождайся за перки.</div><button class="ab ok" id="go">Начать</button>`,()=>{$('#go').onclick=()=>{S.seen=1;closeM();A()}})}
function saveG(){S.ts=Date.now();try{localStorage.setItem('zui3',JSON.stringify(S))}catch(e){}}
let last=Date.now(),lastCat=0,lastZin=0,lastGos=0;
setInterval(()=>{const n=Date.now(),dt=Math.min((n-last)/1000,5);last=n;
  if(S.modT>0){S.modT-=dt;if(S.modT<=0){S.modT=0;S.modV=1}}
  const prev=phase();S.t+=dt;if(phase()==='night'&&prev!=='night')S.st.nights++;
  S.en=Math.min(enMax(),S.en+dt/4);S.p+=sec()*mult()*dt;
  if(lv('cat')>=1&&n-lastCat>60000){lastCat=n;addI(pick(['fish1','flow','feath']));toast('🐱 Кот принёс подарок')}
  if(lv('zin')>=1&&n-lastZin>120000){lastZin=n;S.rep++;toast('🧕 Тётя Зина: +1 ⭐')}
  if(lv('gos')>=1&&n-lastGos>90000){lastGos=n;addI('feath');toast('🦢 Гоша принёс перо')}
  hud()},250);
setInterval(()=>{checkAch();saveG();if(!down&&!busy&&(tab===1||tab===3))renderAll()},3000);
document.addEventListener('pointerdown',()=>down=1);document.addEventListener('pointerup',()=>setTimeout(()=>down=0,300));
/* старт */
buildNav();
ensureDaily();
const off=Math.min(8*3600,(Date.now()-S.ts)/1000);
if(S.seen&&off>60&&sec()>0){const x=Math.floor(sec()*mult()*off*.5);S.p+=x;S.en=Math.min(enMax(),S.en+off/4);setTimeout(()=>toast('🌙 Пока тебя не было ('+Math.floor(off/60)+' мин): +'+fmt(x)+' 🥔'),800)}
renderAll();hud();
if(!S.seen)setTimeout(tutorial,300);
evTimer=setTimeout(showEv,50000);
</script>
</body>
</html>
