  const bq=$('#nav button[data-t="2"] i'),nd=QU.filter((q,i)=>!S.qc[i]&&q.n()[0]>=q.n()[1]).length;bq.hidden=!nd;bq.textContent=nd;
  const v=$('#view');
  if(tab===0){if(!mapView){mapEl=buildMap();mapView=document.createElement('div');mapView.innerHTML='<h3 class="t">Карта</h3>';mapView.appendChild(mapEl)}
    if(v.firstChild!==mapView){v.innerHTML='';v.appendChild(mapView);if(!mapView.dataset.b){mapView.dataset.b=1;bindMap()}else{const w=$('#mapw');w.scrollLeft=ms.l;w.scrollTop=ms.t}}markMap()}
  if(tab===1){if(!farmEl)buildFarm();if(v.firstChild!==farmEl){v.innerHTML='';v.appendChild(farmEl)}farmList()}
  if(tab===2)viewQ(v);if(tab===3)viewP(v);if(tab===4)viewA(v);if(tab===5)viewM(v);
}
function bindMap(){let z=1.7;const sv=$('#msv'),w=$('#mapw');const set=()=>{sv.style.width=(100*z)+'%'};set();w.scrollLeft=sv.clientWidth*.02;w.scrollTop=sv.clientHeight*.4;
  $('#zi').onclick=()=>{z=Math.min(3.2,z+.5);set()};$('#zo').onclick=()=>{z=Math.max(1,z-.5);set()};
  $('#hsg').addEventListener('click',e=>{const g=e.target.closest('.hs');if(g)openPlace(+g.dataset.i)})}
function markMap(){if(!mapEl)return;PL.forEach((p,i)=>{const g=$(`.hs[data-i="${i}"]`,mapEl);if(!g)return;const v=!!S.vis[p.id];$('.vk',g).setAttribute('opacity',v?1:0);$('.rg',g).style.display=v?'none':''});BLD.forEach((_,i)=>$('#b'+i,mapEl).classList.toggle('on',!!S.b[i]))}
function buildFarm(){farmEl=document.createElement('div');farmEl.innerHTML=`<div class="potw"><button id="pot" aria-label="Копать">🥔</button></div><div class="sub">${['Инструменты','Помощники','Стройка','Рюкзак'].map((n,i)=>`<button data-s="${i}">${n}</button>`).join('')}</div><div id="flist"></div>`;
  $('#pot',farmEl).onclick=e=>{const g=tap()*mult();S.p+=g;S.st.taps++;SFX.tap();const w=$('.potw',farmEl),r=w.getBoundingClientRect(),f=document.createElement('div');f.className='fx';f.textContent='+'+fmt(g);f.style.left=(e.clientX-r.left-12)+'px';f.style.top=(e.clientY-r.top-20)+'px';w.appendChild(f);setTimeout(()=>f.remove(),900);checkDaily();hud()};
  $$('.sub button',farmEl).forEach(b=>b.onclick=()=>{sub=+b.dataset.s;farmList()});
  $('#flist',farmEl).addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const k=b.dataset.k;if(!k)return;
    if(k[0]==='t'){const i=+k.slice(1);if(!S.tools[i]&&S.p>=TOOLS[i][2]){S.p-=TOOLS[i][2];S.tools[i]=1;SFX.buy();toast('Куплено: '+TOOLS[i][1])}}
    if(k[0]==='h'){const i=+k.slice(1);if(S.p>=hc(i)){S.p-=hc(i);S.help[i]++;SFX.buy();toast(HELP[i][1]+' на работе.')}}
    if(k[0]==='b'){const i=+k.slice(1);if(!S.b[i]&&S.p>=BLD[i][2]){S.p-=BLD[i][2];S.b[i]=1;S.rep+=3;SFX.ev();toast('Построено: '+BLD[i][1]+'!')}}
    if(k[0]==='s'&&k.includes('|')){const [,item,mode]=k.split('|');sellAll(item,mode==='1')}
    if(k[0]==='c')craft(+k.slice(1));
    checkAch();checkDaily();saveG();hud();farmList()})}
function farmList(){if(!farmEl)return;$$('.sub button',farmEl).forEach(b=>b.classList.toggle('on',+b.dataset.s===sub));let h='';
  if(sub===0)TOOLS.forEach((t,i)=>{const d=S.tools[i];h+=`<div class="it ${d?'done':''}"><div class="e">${t[0]}</div><div class="m"><b>${t[1]}</b><small>+${t[3]} за клик</small></div><button data-k="t${i}" ${d||S.p<t[2]?'disabled':''}>${d?'✓':fmt(t[2])+' 🥔'}</button></div>`});
  if(sub===1)HELP.forEach((t,i)=>{h+=`<div class="it"><div class="e">${t[0]}</div><div class="m"><b>${t[1]} ×${S.help[i]}</b><small>+${t[3]}/с</small></div><button data-k="h${i}" ${S.p<hc(i)?'disabled':''}>${fmt(hc(i))} 🥔</button></div>`});
  if(sub===2)BLD.forEach((t,i)=>{const d=S.b[i];h+=`<div class="it ${d?'done':''}"><div class="e">${t[0]}</div><div class="m"><b>${t[1]}</b><small>+10% к доходу</small></div><button data-k="b${i}" ${d||S.p<t[2]?'disabled':''}>${d?'✓':fmt(t[2])+' 🥔'}</button></div>`});
  if(sub===3){const ks=Object.keys(IT).filter(k=>S.inv[k]>0);h+=`<h3 class="t">Рюкзак</h3>`+(ks.length?'':'<p style="color:var(--mut)">Пусто.</p>')+ks.map(k=>`<div class="it"><div class="e">${IT[k][0]}</div><div class="m"><b>${IT[k][1]} ×${S.inv[k]}</b></div><button data-k="s|${k}|1">1</button><button data-k="s|${k}|A">Все</button></div>`).join('')+`<h3 class="t">Готовка</h3>`+REC.map((r,i)=>`<div class="it"><div class="e">${IT[r[0]][0]}</div><div class="m"><b>${r[1]}</b></div><button data-k="c${i}">Сделать</button></div>`).join('')}
  $('#flist',farmEl).innerHTML=h}
function viewQ(v){const c=curQ();let h=`<h3 class="t">Квесты</h3>`;QU.forEach((q,i)=>{const [a,b]=q.n(),done=a>=b,cl=S.qc[i];const rw=[q.r.p?fmt(q.r.p)+' 🥔':'',q.r.rep?'+'+q.r.rep+' ⭐':''].filter(Boolean).join(' ');h+=`<div class="it ${cl?'done':''}"><div class="e">${cl?'✅':done?'🎁':'📌'}</div><div class="m"><b>${q.t}</b><small>${q.d}</small><div class="bar"><i style="width:${Math.min(100,100*a/b)}%"></i></div><small>${Math.min(a,b)} / ${b} · ${rw}</small></div>${done&&!cl?`<button data-q="${i}">Забрать</button>`:''}</div>`});
  if(S.daily){const pr=Math.min(50,S.st.taps-S.daily.start),done=pr>=50;h+=`<h3 class="t">Ежедневка</h3><div class="it ${S.dailyDone?'done':''}"><div class="e">${S.dailyDone?'✅':done?'🎁':'📅'}</div><div class="m"><b>Копнуть 50 раз</b><div class="bar"><i style="width:${Math.min(100,100*pr/50)}%"></i></div><small>${Math.max(0,pr)} / 50 · 500 🥔</small></div>${done&&!S.dailyDone?`<button id="dailyBtn">Забрать</button>`:''}</div>`}
  v.innerHTML=h;$$('[data-q]',v).forEach(b=>b.onclick=()=>claimQ(+b.dataset.q));const db=$('#dailyBtn');if(db)db.onclick=claimDaily;
}
function viewP(v){let h=`<h3 class="t">Жители</h3>`;NP.forEach(n=>{const l=lv(n.id),fp=(S.fp[n.id]||0)%10;const cd=Math.ceil(((S.cd['t'+n.id]||0)-Date.now())/1000);h+=`<div class="it" style="align-items:flex-start"><div class="e">${n.e}</div><div class="m"><b>${n.n}</b><small>${n.r}</small><div class="hr">${'❤️'.repeat(l)}${'🤍'.repeat(5-l)}</div><small>${n.perk}</small><div class="row"><button data-tk="${n.id}" ${cd>0?'disabled':''}>💬${cd>0?' '+cd:''}</button><button data-gf="${n.id}">🎁</button></div></div></div>`});v.innerHTML=h;$$('[data-tk]',v).forEach(b=>b.onclick=()=>talk(b.dataset.tk));$$('[data-gf]',v).forEach(b=>b.onclick=()=>gift(b.dataset.gf))}
function viewA(v){let h=`<h3 class="t">Фото (${nPh()}/17)</h3><div class="alb">`;for(let i=1;i<=17;i++){const p=PI[i];if(!p)continue;const o=S.ph[i];h+=o?`<div class="ph"><div class="lk" style="background:#e8b85a;font-size:40px">📸</div><b>${p.t}</b><small>✓</small></div>`:`<div class="ph"><div class="lk">🔒</div><b>№${i}</b><small>${p.h||'В любое время.'}</small></div>`}v.innerHTML=h+'</div>'}
function viewM(v){const cp=canPrestige(), gain=Math.floor(Math.sqrt(S.p/1e6))*(1+(S.prestige||0));let h=`<h3 class="t">Перерождение</h3><div class="it"><div class="e">🔥</div><div class="m"><b>${S.prestige||0}</b><small>${cp?'+'+gain+' перков':'Нужно '+fmt(1e6*Math.pow(3,S.prestige||0))+' 🥔'}</small></div>${cp?`<button id="pBtn" style="background:var(--bad);color:#fff">🔥</button>`:''}</div>
<h3 class="t">Настройки</h3><div class="row"><button id="sSn">${snd?'🔊':'🔇'}</button><button id="sSe">${season()==='winter'?'❄️':'☀️'}</button></div><div class="row"><button id="sTheme">🌓 Тема</button><button id="sSh">↗ Поделиться</button></div><div class="row"><button id="sExp">📤 Экспорт</button><button id="sImp">📥 Импорт</button></div><div class="row"><button id="sRs" style="background:var(--bad);color:#fff">🗑️ Заново</button></div>`;
  v.innerHTML=h;if($('#pBtn'))$('#pBtn').onclick=doPrestige;$('#sSn').onclick=()=>{snd=!snd;S.snd=snd?1:0;if(snd){A();SFX.good()}hud();viewM(v)};$('#sSe').onclick=()=>{S.t=(Math.floor(S.t/540)+1)*540+1;hud();viewM(v)};$('#sTheme').onclick=()=>{const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';S.theme=document.documentElement.dataset.theme;saveG();viewM(v)};$('#sSh').onclick=share;$('#sExp').onclick=exportSave;$('#sImp').onclick=importSave;$('#sRs').onclick=()=>{if(confirm('Начать заново?')){S=def();try{localStorage.removeItem('zui3')}catch(e){}mapEl=null;farmEl=null;mapView=null;tab=0;renderAll();hud()}}}
async function share(){const d={title:'Зуи',text:'Играй!',url:location.href};try{if(navigator.share&&location.protocol!=='file:'){await navigator.share(d);return}}catch(e){}try{await navigator.clipboard.writeText(location.href);toast('🔗 Скопировано!');return}catch(e){}exportSave()}
function exportSave(){const code=btoa(encodeURIComponent(JSON.stringify(S)));if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>toast('📤 Скопировано!')).catch(()=>prompt('Код:',code))}else prompt('Код:',code)}
function importSave(){const code=prompt('Вставь код:');if(!code)return;try{S=Object.assign(def(),JSON.parse(decodeURIComponent(atob(code))));S.st=Object.assign(def().st,S.st||{});if(S.theme)document.documentElement.dataset.theme=S.theme;snd=!!S.snd;mapEl=null;farmEl=null;mapView=null;renderAll();hud();toast('📥 Загружено!')}catch(e){toast('❌ Ошибка')}}
function hud(){
  $('#p').textContent=fmt(S.p);$('#ps').textContent='+'+fmt(sec()*mult())+'/с';$('#repP').textContent='⭐ '+S.rep;
  $('#prP').style.display=S.prestige?'':'none';$('#prP').textContent='🔥 '+(S.prestige||0);
  const m=enMax();$('#enb').style.width=Math.min(100,100*S.en/m)+'%';$('#ent').textContent='⚡ '+Math.floor(S.en)+' / '+m;
  $('#clk').textContent={morning:'🌅',day:'☀️',evening:'🌇',night:'🌙'}[phase()]+(season()==='winter'?'❄️':'');$('#snd').textContent=snd?'🔊':'🔇';
  const c=curQ(),h=$('#hint');if(c<0)h.textContent='🏆 Все квесты выполнены!';else{const q=QU[c],[a,b]=q.n();h.textContent=a>=b?'🎁 Квест «'+q.t+'» готов!':'📌 '+q.t+': '+q.d+' ('+Math.min(a,b)+'/'+b+')'}
  if(mapEl){const ph=phase(),n={morning:.1,day:0,evening:.22,night:.55}[ph];$('#nt',mapEl).style.opacity=n;$('#lit',mapEl).style.opacity=ph==='night'?1:ph==='evening'?.6:0;$('#wt',mapEl).style.opacity=season()==='winter'?1:0}
}
$('#hint').onclick=()=>{tab=2;renderAll()};
$('#skip').onclick=()=>{const x=S.t%180,b=[30,100,140,180].find(v=>v>x);S.t+=b-x+.5;if(phase()==='night')S.st.nights++;SFX.pop();hud();toast('Время: '+{morning:'утро',day:'день',evening:'вечер',night:'ночь'}[phase()]+(season()==='winter'?', зима':', лето'))};
$('#snd').onclick=()=>{snd=!snd;S.snd=snd?1:0;if(snd){A();SFX.good()}hud()};
function saveG(){S.ts=Date.now();try{localStorage.setItem('zui3',JSON.stringify(S))}catch(e){}}
let last=Date.now();
setInterval(()=>{const n=Date.now(),dt=Math.min((n-last)/1000,5);last=n;if(S.modT>0){S.modT-=dt;if(S.modT<=0){S.modT=0;S.modV=1}}S.t+=dt;S.en=Math.min(enMax(),S.en+dt/4);S.p+=sec()*mult()*dt;hud()},250);
setInterval(()=>{checkAch();saveG();if(!down&&!busy&&(tab===1||tab===3))renderAll()},3000);
document.addEventListener('pointerdown',()=>down=1);document.addEventListener('pointerup',()=>setTimeout(()=>down=0,300));
buildNav();ensureDaily();const off=Math.min(8*3600,(Date.now()-S.ts)/1000);if(S.seen&&off>60&&sec()>0){const x=Math.floor(sec()*mult()*off*.5);S.p+=x;S.en=Math.min(enMax(),S.en+off/4);}
renderAll();hud();
</script>
</body>
